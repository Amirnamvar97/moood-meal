<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت هزینه غذا - شرکت موعود</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-jalaali@0.9.6/dist/moment-jalaali.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-btn {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .menu-btn .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .menu-btn h3 {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .menu-btn p {
            color: #666;
            font-size: 0.9em;
        }

        .content-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .content-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .stat-card h4 {
            font-size: 0.9em;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 1.8em;
            font-weight: 700;
        }

        .suggestion-box {
            background: #f8f9fa;
            border-right: 4px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .suggestion-box h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .table-container {
            overflow-x: auto;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .chart-container {
            margin: 30px 0;
            height: 400px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .main-menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ سیستم مدیریت هزینه غذا</h1>
            <p class="subtitle">شرکت موعود</p>
        </div>

        <!-- Main Menu -->
        <div id="mainMenu" class="main-menu">
            <button class="menu-btn" onclick="showSection('entry')">
                <div class="icon">➕</div>
                <h3>ثبت هزینه روزانه</h3>
                <p>ثبت هزینه صبحانه یا ناهار امروز</p>
            </button>
            <button class="menu-btn" onclick="showSection('reports')">
                <div class="icon">📊</div>
                <h3>گزارش‌ها و آمار</h3>
                <p>مشاهده گزارش‌های تفصیلی</p>
            </button>
            <button class="menu-btn" onclick="showSection('suggestion')">
                <div class="icon">💡</div>
                <h3>پیشنهاد هزینه</h3>
                <p>دریافت پیشنهاد هزینه امروز</p>
            </button>
            <button class="menu-btn" onclick="showSection('settings')">
                <div class="icon">⚙️</div>
                <h3>تنظیمات</h3>
                <p>مدیریت سقف هزینه‌ها</p>
            </button>
        </div>

        <!-- Entry Section -->
        <div id="entrySection" class="content-section">
            <h2 style="margin-bottom: 20px;">ثبت هزینه روزانه</h2>
            <div id="entryAlert"></div>
            <form id="entryForm">
                <div class="form-group">
                    <label>تاریخ:</label>
                    <input type="text" id="entryDate" readonly>
                </div>
                <div class="form-group">
                    <label>نوع وعده:</label>
                    <select id="mealType" required onchange="updateMealInfo()">
                        <option value="">انتخاب کنید</option>
                        <option value="breakfast">صبحانه</option>
                        <option value="lunch">ناهار</option>
                    </select>
                </div>
                <div id="mealInfo" style="display: none;" class="suggestion-box">
                    <p><strong>سقف هزینه:</strong> <span id="mealLimit"></span> تومان</p>
                    <p><strong>روزهای مجاز:</strong> <span id="mealDays"></span></p>
                </div>
                <div class="form-group">
                    <label>تعداد نفرات:</label>
                    <input type="number" id="peopleCount" min="1" required>
                </div>
                <div class="form-group">
                    <label>هزینه کل (تومان):</label>
                    <input type="number" id="totalCost" min="0" step="1000" required>
                </div>
                <div id="costPerPerson" style="margin: 15px 0; font-size: 1.1em; color: #667eea;"></div>
                <button type="submit" class="btn">ثبت هزینه</button>
                <button type="button" class="btn btn-secondary" onclick="showSection('main')">بازگشت</button>
            </form>
        </div>

        <!-- Suggestion Section -->
        <div id="suggestionSection" class="content-section">
            <h2 style="margin-bottom: 20px;">پیشنهاد هزینه امروز</h2>
            <div class="form-group">
                <label>تاریخ امروز:</label>
                <input type="text" id="suggestionDate" readonly>
            </div>
            <div class="form-group">
                <label>نوع وعده:</label>
                <select id="suggestionMealType" onchange="calculateSuggestion()">
                    <option value="">انتخاب کنید</option>
                    <option value="breakfast">صبحانه</option>
                    <option value="lunch">ناهار</option>
                </select>
            </div>
            <div class="form-group">
                <label>تعداد نفرات امروز:</label>
                <input type="number" id="suggestionPeople" min="1" onchange="calculateSuggestion()">
            </div>
            <div id="suggestionResult"></div>
            <button class="btn btn-secondary" onclick="showSection('main')">بازگشت</button>
        </div>

        <!-- Reports Section -->
        <div id="reportsSection" class="content-section">
            <h2 style="margin-bottom: 20px;">گزارش‌ها و آمار</h2>
            
            <div class="stats-grid" id="statsGrid"></div>
            
            <div style="margin: 30px 0;">
                <label>انتخاب بازه زمانی:</label>
                <select id="reportPeriod" onchange="updateReports()">
                    <option value="week">هفته جاری</option>
                    <option value="month">ماه جاری</option>
                    <option value="all">همه موارد</option>
                </select>
            </div>

            <div class="chart-container">
                <canvas id="costChart"></canvas>
            </div>

            <div class="chart-container">
                <canvas id="avgChart"></canvas>
            </div>

            <h3 style="margin: 30px 0 20px 0;">جزئیات روزانه</h3>
            <div class="table-container">
                <table id="detailsTable">
                    <thead>
                        <tr>
                            <th>تاریخ</th>
                            <th>روز</th>
                            <th>وعده</th>
                            <th>تعداد نفر</th>
                            <th>هزینه کل</th>
                            <th>میانگین هر نفر</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody id="detailsBody"></tbody>
                </table>
            </div>

            <button class="btn btn-secondary" onclick="showSection('main')">بازگشت</button>
        </div>

        <!-- Settings Section -->
        <div id="settingsSection" class="content-section">
            <h2 style="margin-bottom: 20px;">تنظیمات</h2>
            <div class="form-group">
                <label>سقف هزینه صبحانه (تومان):</label>
                <input type="number" id="breakfastLimit" min="0" step="1000">
            </div>
            <div class="form-group">
                <label>سقف هزینه ناهار (تومان):</label>
                <input type="number" id="lunchLimit" min="0" step="1000">
            </div>
            <button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button>
            <button class="btn btn-secondary" onclick="showSection('main')">بازگشت</button>
        </div>

        <div class="footer">
            طراحی و توسعه توسط: امیر | شرکت موعود © 1405
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            breakfastLimit: 100000,
            lunchLimit: 280000
        };

        // Load saved settings
        function loadSettings() {
            const saved = localStorage.getItem('mealSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                CONFIG.breakfastLimit = settings.breakfastLimit || 100000;
                CONFIG.lunchLimit = settings.lunchLimit || 280000;
            }
        }

        function saveSettings() {
            const breakfastLimit = parseInt(document.getElementById('breakfastLimit').value);
            const lunchLimit = parseInt(document.getElementById('lunchLimit').value);
            
            if (breakfastLimit && lunchLimit) {
                CONFIG.breakfastLimit = breakfastLimit;
                CONFIG.lunchLimit = lunchLimit;
                localStorage.setItem('mealSettings', JSON.stringify(CONFIG));
                alert('تنظیمات با موفقیت ذخیره شد');
            }
        }

        // Initialize
        loadSettings();
        document.getElementById('breakfastLimit').value = CONFIG.breakfastLimit;
        document.getElementById('lunchLimit').value = CONFIG.lunchLimit;

        // Get current Jalali date
        function getCurrentJalaliDate() {
            return moment().format('jYYYY/jMM/jDD');
        }

        function getJalaliDayName(date) {
            const days = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'];
            return days[moment(date, 'jYYYY/jMM/jDD').day()];
        }

        // Set current date
        document.getElementById('entryDate').value = getCurrentJalaliDate();
        document.getElementById('suggestionDate').value = getCurrentJalaliDate();

        // Show/Hide sections
        function showSection(section) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('mainMenu').style.display = 'none';
            
            if (section === 'main') {
                document.getElementById('mainMenu').style.display = 'grid';
            } else if (section === 'entry') {
                document.getElementById('entrySection').classList.add('active');
            } else if (section === 'reports') {
                document.getElementById('reportsSection').classList.add('active');
                updateReports();
            } else if (section === 'suggestion') {
                document.getElementById('suggestionSection').classList.add('active');
            } else if (section === 'settings') {
                document.getElementById('settingsSection').classList.add('active');
            }
        }

        // Update meal info
        function updateMealInfo() {
            const mealType = document.getElementById('mealType').value;
            const infoDiv = document.getElementById('mealInfo');
            
            if (mealType) {
                const limit = mealType === 'breakfast' ? CONFIG.breakfastLimit : CONFIG.lunchLimit;
                const days = mealType === 'breakfast' ? 'شنبه تا پنجشنبه' : 'شنبه تا چهارشنبه';
                
                document.getElementById('mealLimit').textContent = limit.toLocaleString('fa-IR');
                document.getElementById('mealDays').textContent = days;
                infoDiv.style.display = 'block';
            } else {
                infoDiv.style.display = 'none';
            }
        }

        // Calculate cost per person
        document.getElementById('totalCost').addEventListener('input', function() {
            const people = parseInt(document.getElementById('peopleCount').value);
            const total = parseInt(this.value);
            
            if (people && total) {
                const perPerson = Math.round(total / people);
                document.getElementById('costPerPerson').innerHTML = 
                    `<strong>هزینه هر نفر: ${perPerson.toLocaleString('fa-IR')} تومان</strong>`;
            }
        });

        document.getElementById('peopleCount').addEventListener('input', function() {
            const total = parseInt(document.getElementById('totalCost').value);
            const people = parseInt(this.value);
            
            if (people && total) {
                const perPerson = Math.round(total / people);
                document.getElementById('costPerPerson').innerHTML = 
                    `<strong>هزینه هر نفر: ${perPerson.toLocaleString('fa-IR')} تومان</strong>`;
            }
        });

        // Handle form submission
        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const date = document.getElementById('entryDate').value;
            const mealType = document.getElementById('mealType').value;
            const people = parseInt(document.getElementById('peopleCount').value);
            const totalCost = parseInt(document.getElementById('totalCost').value);
            const costPerPerson = Math.round(totalCost / people);
            
            const entry = {
                date,
                dayName: getJalaliDayName(date),
                mealType,
                people,
                totalCost,
                costPerPerson
            };
            
            // Save to localStorage
            let entries = JSON.parse(localStorage.getItem('mealEntries') || '[]');
            entries.push(entry);
            localStorage.setItem('mealEntries', JSON.stringify(entries));
            
            // Show success message
            const limit = mealType === 'breakfast' ? CONFIG.breakfastLimit : CONFIG.lunchLimit;
            const status = costPerPerson <= limit ? 'success' : 'warning';
            const message = costPerPerson <= limit 
                ? `✅ هزینه در محدوده مجاز است (${limit.toLocaleString('fa-IR')} تومان)`
                : `⚠️ هزینه از محدوده مجاز (${limit.toLocaleString('fa-IR')} تومان) بیشتر است`;
            
            document.getElementById('entryAlert').innerHTML = 
                `<div class="alert alert-${status}">${message}<br>هزینه ثبت شد: ${totalCost.toLocaleString('fa-IR')} تومان برای ${people} نفر</div>`;
            
            // Reset form
            document.getElementById('entryForm').reset();
            document.getElementById('entryDate').value = getCurrentJalaliDate();
            document.getElementById('mealInfo').style.display = 'none';
            document.getElementById('costPerPerson').innerHTML = '';
        });

        // Calculate suggestion
        function calculateSuggestion() {
            const mealType = document.getElementById('suggestionMealType').value;
            const people = parseInt(document.getElementById('suggestionPeople').value);
            const currentDate = getCurrentJalaliDate();
            
            if (!mealType || !people) return;
            
            const entries = JSON.parse(localStorage.getItem('mealEntries') || '[]');
            const currentWeek = moment(currentDate, 'jYYYY/jMM/jDD').startOf('jWeek');
            
            // Get entries for current week and meal type
            const weekEntries = entries.filter(e => {
                const entryDate = moment(e.date, 'jYYYY/jMM/jDD');
                return e.mealType === mealType && 
                       entryDate.isSameOrAfter(currentWeek) && 
                       entryDate.isBefore(currentDate, 'day');
            });
            
            if (weekEntries.length === 0) {
                document.getElementById('suggestionResult').innerHTML = 
                    '<div class="suggestion-box"><h3>💡 پیشنهاد</h3><p>هنوز داده‌ای برای این هفته ثبت نشده است. شروع با هزینه استاندارد توصیه می‌شود.</p><p><strong>هزینه پیشنهادی کل: ' + 
                    ((mealType === 'breakfast' ? CONFIG.breakfastLimit : CONFIG.lunchLimit) * people).toLocaleString('fa-IR') + 
                    ' تومان</strong></p></div>';
                return;
            }
            
            // Calculate average
            const totalSpent = weekEntries.reduce((sum, e) => sum + e.totalCost, 0);
            const totalPeople = weekEntries.reduce((sum, e) => sum + e.people, 0);
            const avgPerPerson = Math.round(totalSpent / totalPeople);
            
            const limit = mealType === 'breakfast' ? CONFIG.breakfastLimit : CONFIG.lunchLimit;
            const remainingDays = mealType === 'breakfast' ? 5 - weekEntries.length : 4 - weekEntries.length;
            
            // Calculate suggested cost
            const targetTotal = limit * (weekEntries.length + remainingDays);
            const spent = totalSpent;
            const remaining = targetTotal - spent;
            const suggestedPerPerson = Math.round(remaining / (remainingDays * people));
            const suggestedTotal = suggestedPerPerson * people;
            
            let statusClass = 'success';
            let statusIcon = '✅';
            let statusText = 'در محدوده مجاز';
            
            if (avgPerPerson > limit) {
                statusClass = 'danger';
                statusIcon = '❌';
                statusText = 'بیشتر از حد مجاز';
            } else if (avgPerPerson > limit * 0.9) {
                statusClass = 'warning';
                statusIcon = '⚠️';
                statusText = 'نزدیک به حد مجاز';
            }
            
            document.getElementById('suggestionResult').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>میانگین هفته جاری</h4>
                        <div class="value">${avgPerPerson.toLocaleString('fa-IR')}</div>
                        <small>تومان/نفر</small>
                    </div>
                    <div class="stat-card">
                        <h4>سقف هزینه</h4>
                        <div class="value">${limit.toLocaleString('fa-IR')}</div>
                        <small>تومان/نفر</small>
                    </div>
                    <div class="stat-card">
                        <h4>روزهای ثبت شده</h4>
                        <div class="value">${weekEntries.length}</div>
                        <small>روز</small>
                    </div>
                    <div class="stat-card">
                        <h4>وضعیت</h4>
                        <div class="value">${statusIcon}</div>
                        <small>${statusText}</small>
                    </div>
                </div>
                <div class="suggestion-box">
                    <h3>💡 پیشنهاد برای امروز</h3>
                    <p>برای رسیدن به میانگین هفتگی ${limit.toLocaleString('fa-IR')} تومان:</p>
                    <p style="font-size: 1.3em; color: #667eea; margin: 15px 0;">
                        <strong>هزینه پیشنهادی کل: ${Math.max(0, suggestedTotal).toLocaleString('fa-IR')} تومان</strong>
                    </p>
                    <p>برای ${people} نفر (${Math.max(0, suggestedPerPerson).toLocaleString('fa-IR')} تومان به ازای هر نفر)</p>
                    ${suggestedPerPerson < 0 ? '<p class="alert alert-warning">⚠️ هزینه‌های هفته از سقف مجاز عبور کرده است. سعی کنید هزینه امروز را کمتر نگه دارید.</p>' : ''}
                </div>
            `;
        }

        // Update reports
        let costChart, avgChart;

        function updateReports() {
            const entries = JSON.parse(localStorage.getItem('mealEntries') || '[]');
            const period = document.getElementById('reportPeriod').value;
            const currentDate = moment();
            
            let filteredEntries = entries;
            
            if (period === 'week') {
                const weekStart = currentDate.clone().startOf('jWeek');
                filteredEntries = entries.filter(e => 
                    moment(e.date, 'jYYYY/jMM/jDD').isSameOrAfter(weekStart)
                );
            } else if (period === 'month') {
                const monthStart = currentDate.clone().startOf('jMonth');
                filteredEntries = entries.filter(e => 
                    moment(e.date, 'jYYYY/jMM/jDD').isSameOrAfter(monthStart)
                );
            }
            
            // Calculate stats
            const breakfastEntries = filteredEntries.filter(e => e.mealType === 'breakfast');
            const lunchEntries = filteredEntries.filter(e => e.mealType === 'lunch');
            
            const breakfastAvg = breakfastEntries.length > 0
                ? Math.round(breakfastEntries.reduce((sum, e) => sum + e.costPerPerson, 0) / breakfastEntries.length)
                : 0;
            
            const lunchAvg = lunchEntries.length > 0
                ? Math.round(lunchEntries.reduce((sum, e) => sum + e.costPerPerson, 0) / lunchEntries.length)
                : 0;
            
            const totalCost = filteredEntries.reduce((sum, e) => sum + e.totalCost, 0);
            
            // Update stats grid
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <h4>میانگین صبحانه</h4>
                    <div class="value">${breakfastAvg.toLocaleString('fa-IR')}</div>
                    <small>تومان/نفر</small>
                </div>
                <div class="stat-card">
                    <h4>میانگین ناهار</h4>
                    <div class="value">${lunchAvg.toLocaleString('fa-IR')}</div>
                    <small>تومان/نفر</small>
                </div>
                <div class="stat-card">
                    <h4>هزینه کل</h4>
                    <div class="value">${(totalCost / 1000000).toFixed(1)}</div>
                    <small>میلیون تومان</small>
                </div>
                <div class="stat-card">
                    <h4>تعداد کل</h4>
                    <div class="value">${filteredEntries.length}</div>
                    <small>وعده غذایی</small>
                </div>
            `;
            
            // Update table
            const tbody = document.getElementById('detailsBody');
            tbody.innerHTML = '';
            
            filteredEntries.reverse().forEach(entry => {
                const limit = entry.mealType === 'breakfast' ? CONFIG.breakfastLimit : CONFIG.lunchLimit;
                const status = entry.costPerPerson <= limit ? '✅ مجاز' : '⚠️ بیش از حد';
                const statusClass = entry.costPerPerson <= limit ? 'success' : 'warning';
                
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${entry.date}</td>
                    <td>${entry.dayName}</td>
                    <td>${entry.mealType === 'breakfast' ? 'صبحانه' : 'ناهار'}</td>
                    <td>${entry.people}</td>
                    <td>${entry.totalCost.toLocaleString('fa-IR')}</td>
                    <td>${entry.costPerPerson.toLocaleString('fa-IR')}</td>
                    <td style="color: ${statusClass === 'success' ? '#28a745' : '#ffc107'}">${status}</td>
                `;
            });
            
            // Update charts
            updateCharts(filteredEntries);
        }

        function updateCharts(entries) {
            // Prepare data for charts
            const dates = [...new Set(entries.map(e => e.date))].sort();
            const breakfastData = dates.map(date => {
                const entry = entries.find(e => e.date === date && e.mealType === 'breakfast');
                return entry ? entry.totalCost : null;
            });
            const lunchData = dates.map(date => {
                const entry = entries.find(e => e.date === date && e.mealType === 'lunch');
                return entry ? entry.totalCost : null;
            });
            
            // Cost chart
            const costCtx = document.getElementById('costChart').getContext('2d');
            if (costChart) costChart.destroy();
            
            costChart = new Chart(costCtx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'صبحانه',
                        data: breakfastData,
                        borderColor: '#ffc107',
                        backgroundColor: 'rgba(255, 193, 7, 0.1)',
                        tension: 0.4
                    }, {
                        label: 'ناهار',
                        data: lunchData,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'روند هزینه‌های روزانه',
                            font: { size: 16, family: 'Vazirmatn' }
                        },
                        legend: {
                            labels: { font: { family: 'Vazirmatn' } }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                font: { family: 'Vazirmatn' },
                                callback: value => value.toLocaleString('fa-IR')
                            }
                        },
                        x: {
                            ticks: { font: { family: 'Vazirmatn' } }
                        }
                    }
                }
            });
            
            // Average chart
            const breakfastAvgs = dates.map(date => {
                const entry = entries.find(e => e.date === date && e.mealType === 'breakfast');
                return entry ? entry.costPerPerson : null;
            });
            const lunchAvgs = dates.map(date => {
                const entry = entries.find(e => e.date === date && e.mealType === 'lunch');
                return entry ? entry.costPerPerson : null;
            });
            
            const avgCtx = document.getElementById('avgChart').getContext('2d');
            if (avgChart) avgChart.destroy();
            
            avgChart = new Chart(avgCtx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'صبحانه',
                        data: breakfastAvgs,
                        backgroundColor: 'rgba(255, 193, 7, 0.7)'
                    }, {
                        label: 'ناهار',
                        data: lunchAvgs,
                        backgroundColor: 'rgba(102, 126, 234, 0.7)'
                    }, {
                        label: 'سقف صبحانه',
                        data: dates.map(() => CONFIG.breakfastLimit),
                        type: 'line',
                        borderColor: '#dc3545',
                        borderDash: [5, 5],
                        fill: false
                    }, {
                        label: 'سقف ناهار',
                        data: dates.map(() => CONFIG.lunchLimit),
                        type: 'line',
                        borderColor: '#dc3545',
                        borderDash: [5, 5],
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'میانگین هزینه هر نفر در مقایسه با سقف مجاز',
                            font: { size: 16, family: 'Vazirmatn' }
                        },
                        legend: {
                            labels: { font: { family: 'Vazirmatn' } }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                font: { family: 'Vazirmatn' },
                                callback: value => value.toLocaleString('fa-IR')
                            }
                        },
                        x: {
                            ticks: { font: { family: 'Vazirmatn' } }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
